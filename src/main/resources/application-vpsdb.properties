# Local profile to reach PostgreSQL running inside the VPS docker-compose stack.
# Open an SSH tunnel first:
# ssh -N -L 5433:127.0.0.1:5432 root@<your-vps-ip>

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mhv}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mhv}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
